[package]
name = "psccm"
version = "0.2.3"
edition = "2024"
description = "Lightweight agentless deployment manager for Windows and Linux"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
ldap3 = "0.12"
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
regex = "1"
rpassword = "7"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.11"
sysinfo = "0.39"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
ed25519-dalek = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_Pipes",
    "Win32_System_Console",
    "Win32_System_RemoteDesktop",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemServices",
    "Win32_Storage_FileSystem",
] }
windows-service = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
