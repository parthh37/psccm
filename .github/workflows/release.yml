name: Release

# Two ways to release:
#  * push a tag like v0.2.3, or
#  * run this workflow by hand (Actions → Release → Run workflow) on main with
#    the tag to create, e.g. v0.2.3. The tag is created at that commit.
# Either way Cargo.toml must already carry the matching version. Running it by
# hand with the tag of a release that already exists only re-runs the tests.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (vX.Y.Z). New → build and publish it; existing → re-test it
        required: true

# Every job asks for what it needs; nothing gets write access by default.
permissions: {}

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # Decide whether to build (new release) or only re-test (release exists).
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      build: ${{ steps.plan.outputs.build }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$TAG' is not a release tag; use the form v1.2.3"
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG exists: re-running the release tests only."
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Cargo.toml on ${GITHUB_REF_NAME} is version $version, so it can only be released as v$version. Bump the version in Cargo.toml (and Cargo.lock) first, or run the workflow with tag v$version."
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::Run the release from the main branch (it ran on $GITHUB_REF)."
              exit 1
            fi
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > /dev/null 2>&1; then
              echo "::error::Tag $TAG already exists without a release; push the tag again or delete it first."
              exit 1
            fi
          fi
          echo "Building and publishing $TAG from $GITHUB_SHA."
          echo "build=true" >> "$GITHUB_OUTPUT"

  # Release builds deliberately do not restore a shared cargo cache, so a
  # poisoned cache entry can never end up inside a published binary.
  build-windows:
    needs: [prepare]
    if: needs.prepare.outputs.build == 'true'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Read version
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne $env:TAG) { throw "Cargo.toml version $v does not match tag $env:TAG" }
          "VERSION=$v" >> $env:GITHUB_ENV
      - name: Test
        run: cargo test --locked --release
      - name: Build
        run: cargo build --locked --release
        env:
          PSCCM_UPDATE_REPO: ${{ github.repository }}
          PSCCM_UPDATE_PUBKEY: ${{ vars.PSCCM_UPDATE_PUBKEY }}
      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Qp "/DAppVersion=$env:VERSION" installer\psccm.iss
          if ($LASTEXITCODE) { throw "ISCC failed" }
          Copy-Item target\release\psccm.exe dist\psccm-x86_64-windows.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  build-linux:
    needs: [prepare]
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - run: cargo test --locked --release
      - run: cargo build --locked --release
        env:
          PSCCM_UPDATE_REPO: ${{ github.repository }}
          PSCCM_UPDATE_PUBKEY: ${{ vars.PSCCM_UPDATE_PUBKEY }}
      - run: mkdir dist && cp target/release/psccm dist/psccm-x86_64-linux
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [prepare, build-windows, build-linux]
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the release
      id-token: write # sign the build provenance
      attestations: write
    steps:
      # Only for src/update.rs (the built-in release key) in "Sign checksums".
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      # PSCCM only installs a release whose SHA256SUMS.sig is a valid ed25519
      # signature, by the key built into it, over "psccm-release <tag>\n" +
      # SHA256SUMS (README, "Release signing").
      - name: Sign checksums
        env:
          PSCCM_SIGNING_KEY: ${{ secrets.PSCCM_SIGNING_KEY }}
          PSCCM_UPDATE_PUBKEY: ${{ vars.PSCCM_UPDATE_PUBKEY }}
          KEY_ROTATION: ${{ vars.PSCCM_KEY_ROTATION }}
        run: |
          if [ -z "$PSCCM_SIGNING_KEY" ]; then
            echo "::error::The PSCCM_SIGNING_KEY secret is not set, so the release cannot be signed (see README, Release signing)."
            exit 1
          fi
          key="$RUNNER_TEMP/signing.pem" msg="$RUNNER_TEMP/signed" sig="$RUNNER_TEMP/sig"
          trap 'rm -f "$key" "$msg" "$sig"' EXIT
          (umask 077 && printf '%s\n' "$PSCCM_SIGNING_KEY" > "$key")
          # The key the binaries were built with (repo variable, else the one in
          # src/update.rs) must be this key's public half, except for the one
          # release that hands installs a new key (PSCCM_KEY_ROTATION=true).
          want="${PSCCM_UPDATE_PUBKEY:-$(sed -n 's/^const RELEASE_PUBKEY: &str = "\(.*\)";/\1/p' src/update.rs)}"
          spki="$(openssl pkey -in "$key" -pubout | sed -n 2p)"
          raw="$(openssl pkey -in "$key" -pubout -outform DER | tail -c 32 | base64 -w0)"
          if [ "$want" != "$spki" ] && [ "$want" != "$raw" ]; then
            if [ "$KEY_ROTATION" = true ] && [ -n "$want" ]; then
              echo "::warning::Key rotation: signing with $spki; this release's binaries trust '$want'."
            else
              echo "::error::PSCCM_SIGNING_KEY (public key $spki) does not match the key built into PSCCM ('$want'), so installs would refuse this release."
              exit 1
            fi
          fi
          { printf 'psccm-release %s\n' "$TAG"; cat dist/SHA256SUMS; } > "$msg"
          openssl pkeyutl -sign -rawin -inkey "$key" -in "$msg" -out "$sig"
          openssl pkeyutl -verify -rawin -inkey "$key" -in "$msg" -sigfile "$sig"
          base64 -w0 "$sig" > dist/SHA256SUMS.sig && echo >> dist/SHA256SUMS.sig
          cat dist/SHA256SUMS.sig
      # Anyone can check a download came from this workflow with
      #   gh attestation verify <file> --repo <owner>/<repo>
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "PSCCM $TAG" --generate-notes --verify-tag
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "PSCCM $TAG" --generate-notes --target "$GITHUB_SHA"
          fi

  # ---------------------------------------------------------------------------
  # Post-release tests: download what was published, install it like a user
  # would and run tests/release-test.ps1 against real WinRM / SSH targets on
  # the (throwaway) CI machines. Reports are attached to the release.
  test-windows:
    needs: [prepare, publish]
    if: always() && needs.prepare.result == 'success' && (needs.publish.result == 'success' || needs.prepare.outputs.build == 'false')
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write # attach the report to the release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$env:TAG" --repo "$env:GITHUB_REPOSITORY" --dir rel --pattern "psccm-setup-*.exe" --pattern SHA256SUMS
      - name: Verify checksum
        shell: pwsh
        run: |
          foreach ($line in Get-Content rel\SHA256SUMS) {
            $hash, $name = $line -split '\s+\*?', 2
            if (-not (Test-Path "rel\$name")) { continue }
            $actual = (Get-FileHash "rel\$name" -Algorithm SHA256).Hash
            if ($actual -ne $hash) { throw "checksum mismatch for $name" }
            "OK  $name"
          }
      - name: Prepare this runner as a target (WinRM)
        shell: pwsh
        run: |
          Enable-PSRemoting -Force -SkipNetworkProfileCheck
          Set-Item WSMan:\localhost\Client\TrustedHosts -Value 'localhost,127.0.0.1' -Force
      - name: Install (silent) and run release tests
        shell: pwsh
        run: |
          $setup = (Get-ChildItem rel\psccm-setup-*.exe).FullName
          ./tests/release-test.ps1 -Setup $setup -ExpectedVersion $env:TAG.TrimStart('v') `
            -WindowsTarget localhost -RealInstalls -UpdateRepo $env:GITHUB_REPOSITORY -ReportDir report
      - name: Attach report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          if (Test-Path report\report.html) {
            Copy-Item report\report.html report\test-report-windows.html
            gh release upload "$env:TAG" report\test-report-windows.html --repo "$env:GITHUB_REPOSITORY" --clobber
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-report-windows
          path: report/
          if-no-files-found: ignore

  test-linux:
    needs: [prepare, publish]
    if: always() && needs.prepare.result == 'success' && (needs.publish.result == 'success' || needs.prepare.outputs.build == 'false')
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: write # attach the report to the release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir rel --pattern psccm-x86_64-linux --pattern SHA256SUMS
      - name: Verify checksum
        run: cd rel && sha256sum --check --ignore-missing SHA256SUMS
      - name: Prepare this runner as a target (SSH + sudo)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q openssh-server
          PW="$(openssl rand -hex 16)"
          echo "::add-mask::$PW"
          echo "LINUX_PW=$PW" >> "$GITHUB_ENV"
          sudo useradd -m -s /bin/bash psccmtest
          echo "psccmtest:$PW" | sudo chpasswd
          sudo usermod -aG sudo psccmtest
          echo 'PasswordAuthentication yes' | sudo tee /etc/ssh/sshd_config.d/99-psccm-test.conf
          sudo systemctl restart ssh
      - name: Run release tests
        shell: pwsh
        run: |
          chmod +x rel/psccm-x86_64-linux
          ./tests/release-test.ps1 -Exe rel/psccm-x86_64-linux -ExpectedVersion $env:TAG.TrimStart('v') `
            -LinuxTarget 127.0.0.1 -LinuxUser psccmtest -LinuxPassword $env:LINUX_PW -RealInstalls `
            -UpdateRepo $env:GITHUB_REPOSITORY -ReportDir report
      - name: Attach report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f report/report.html ]; then
            cp report/report.html report/test-report-linux.html
            gh release upload "$TAG" report/test-report-linux.html --repo "$GITHUB_REPOSITORY" --clobber
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-report-linux
          path: report/
          if-no-files-found: ignore
