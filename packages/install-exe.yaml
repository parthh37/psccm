id: install-exe
name: Install any EXE (from repository)
category: Generic
description: >-
  Push a setup.exe from the repository folder and run it with silent switches. Common
  switches: /S (NSIS), /VERYSILENT /NORESTART (Inno Setup), /quiet /norestart (WiX burn),
  -s (InstallShield).
platforms: [windows]
variables:
  file:
    required: true
    description: EXE path inside the repository, e.g. apps/setup.exe
  args:
    default: /S
    description: Silent install switches
  detect_name:
    default: ""
    description: Optional installed-program name (wildcards ok) used to skip computers that have it
  detect_version:
    default: ""
detect:
  windows: |
    $name = '{{detect_name}}'
    if (-not $name) { exit 1 }
    if (Test-AppInstalled -Name $name -MinVersion '{{detect_version}}') { exit 0 }
    exit 1
steps:
  - name: Run {{file}}
    install:
      file: "{{file}}"
      args: "{{args}}"
